name: Publish release

on:
  push:
    branches: [main]
    paths:
      - .github/release-target
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Open Grok release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

# Release jobs ignore rust-toolchain.toml extras via RUSTUP_TOOLCHAIN and
# install a minimal 1.94.0 (no rust-docs / unused Linux targets). Keep this
# in lockstep with rust-toolchain.toml's channel.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.94.0"
  CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"

jobs:
  resolve:
    name: Resolve and anchor release target
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve target and create missing tag
        id: target
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REQUESTED_TAG"
            sha="$(git rev-list -n 1 "$tag")"
          else
            read -r tag sha < .github/release-target
          fi
          test -n "$tag"
          test -n "$sha"
          version="${tag#v}"
          target_version="$(git show "${sha}:OPEN_GROK_VERSION" | tr -d '\r\n')"
          test "$version" = "$target_version"
          resolved_sha="$(git rev-parse "${sha}^{commit}")"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$resolved_sha"
          else
            git tag "$tag" "$resolved_sha"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x86_64
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content OPEN_GROK_VERSION -TotalCount 1).Trim()
          if ("v$version" -ne '${{ needs.resolve.outputs.tag }}') {
            throw "Tag/version mismatch: tag=${{ needs.resolve.outputs.tag }} version=$version"
          }
          if ((git rev-parse HEAD).Trim() -ne '${{ needs.resolve.outputs.sha }}') {
            throw 'Checked-out commit does not match the resolved release SHA.'
          }

      - name: Install minimal Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustup default 1.94.0
          rustc -vV

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Unique primary key so this run can save. restore-keys prefix-matches
          # the newest previous release cache (GitHub cache is write-once).
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-release-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and verify Windows release
        shell: pwsh
        run: .\scripts\build-windows-release.ps1

      - name: Save Cargo cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/open-grok-windows-x86_64.exe
            dist/open-grok-windows-x86_64.exe.sha256
            dist/install.ps1

  macos:
    name: macOS Apple Silicon
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < OPEN_GROK_VERSION)"
          test "v${version}" = '${{ needs.resolve.outputs.tag }}'
          test "$(git rev-parse HEAD)" = '${{ needs.resolve.outputs.sha }}'

      - name: Install minimal Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustup default 1.94.0
          rustc -vV

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-release-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz"
          curl -fL \
            https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b \
            "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RUNNER_TEMP/ripgrep-15.0.0-aarch64-apple-darwin/rg" \
            >> "$GITHUB_ENV"

      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc-29.3-osx-aarch_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-29.3"
          curl -fL \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip \
            -o "$archive"
          printf '%s  %s\n' \
            2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765 \
            "$archive" | shasum -a 256 -c -
          mkdir -p "$protoc_root"
          unzip -q "$archive" -d "$protoc_root"
          protoc="$protoc_root/bin/protoc"
          printf '%s  %s\n' \
            bdc43e54153911f625a50baf7d4f6bc05008712964141baedd5a61122f93a016 \
            "$protoc" | shasum -a 256 -c -
          test "$("$protoc" --version)" = "libprotoc 29.3"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build and verify macOS release
        shell: bash
        run: ./scripts/build-macos-release.sh

      - name: Upload macOS Cargo timings on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-cargo-timings
          if-no-files-found: ignore
          path: target/cargo-timings/

      - name: Smoke macOS installer
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export HOME="$smoke_root/profile-home"
          export OPENGROK_HOME="$smoke_root/home"
          export OPEN_GROK_BIN_DIR="$smoke_root/bin"
          export OPEN_GROK_RELEASE_BASE_URL="file://$PWD/dist"
          mkdir -p "$HOME"
          bash dist/install.sh '${{ needs.resolve.outputs.tag }}'
          "$smoke_root/bin/open-grok" --version | grep -F "$(cat OPEN_GROK_VERSION)"
          "$smoke_root/bin/open-grok" --version | grep -F "$(git rev-parse --short HEAD)"

      - name: Save Cargo cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload macOS and common assets
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/open-grok-macos-aarch64
            dist/open-grok-macos-aarch64.sha256
            dist/install.sh
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES

  linux:
    name: Linux x86_64
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < OPEN_GROK_VERSION)"
          test "v${version}" = '${{ needs.resolve.outputs.tag }}'
          test "$(git rev-parse HEAD)" = '${{ needs.resolve.outputs.sha }}'

      - name: Install minimal Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustup default 1.94.0
          rustc -vV

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-release-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz"
          curl -fL \
            https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RUNNER_TEMP/ripgrep-15.0.0-x86_64-unknown-linux-musl/rg" \
            >> "$GITHUB_ENV"

      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc-29.3-linux-x86_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-29.3"
          curl -fL \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip \
            -o "$archive"
          printf '%s  %s\n' \
            3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a \
            "$archive" | sha256sum -c -
          mkdir -p "$protoc_root"
          unzip -q "$archive" -d "$protoc_root"
          protoc="$protoc_root/bin/protoc"
          printf '%s  %s\n' \
            5ae94ad986e83f0b52bd8139e036cbf94ddbba3ad348be8e4baf44447d7e19a4 \
            "$protoc" | sha256sum -c -
          test "$("$protoc" --version)" = "libprotoc 29.3"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build and verify Linux release
        shell: bash
        run: ./scripts/build-linux-release.sh

      - name: Upload Linux Cargo timings on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-cargo-timings
          if-no-files-found: ignore
          path: target/cargo-timings/

      - name: Smoke Linux installer
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export HOME="$smoke_root/profile-home"
          export OPENGROK_HOME="$smoke_root/home"
          export OPEN_GROK_BIN_DIR="$smoke_root/bin"
          export OPEN_GROK_RELEASE_BASE_URL="file://$PWD/dist"
          mkdir -p "$HOME"
          bash dist/install.sh '${{ needs.resolve.outputs.tag }}'
          "$smoke_root/bin/open-grok" --version | grep -F "$(cat OPEN_GROK_VERSION)"
          "$smoke_root/bin/open-grok" --version | grep -F "$(git rev-parse --short HEAD)"

      - name: Save Cargo cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            dist/open-grok-linux-x86_64
            dist/open-grok-linux-x86_64.sha256
            dist/install.sh

  publish:
    name: Publish and verify GitHub release
    needs: [resolve, windows, macos, linux]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish exact assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"
          version="${version#v}"
          notes="docs/releases/v${version}.md"
          test -f "$notes"
          if gh release view '${{ needs.resolve.outputs.tag }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '${{ needs.resolve.outputs.tag }}' release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit '${{ needs.resolve.outputs.tag }}' \
              --repo "$GITHUB_REPOSITORY" \
              --title "Open Grok v${version}" \
              --notes-file "$notes" \
              --latest
          else
            gh release create '${{ needs.resolve.outputs.tag }}' release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Open Grok v${version}" \
              --notes-file "$notes" \
              --latest
          fi

      - name: Re-download and compare public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-assets
          gh release download '${{ needs.resolve.outputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --dir public-assets
          for local_asset in release-assets/*; do
            name="$(basename "$local_asset")"
            cmp "$local_asset" "public-assets/$name"
          done
          latest_tag="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          )"
          test "$latest_tag" = '${{ needs.resolve.outputs.tag }}'
