name: Publish release

on:
  push:
    branches: [main]
    paths:
      - .github/release-target
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Open Grok release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release target
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release target
        id: target
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REQUESTED_TAG"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Error: workflow_dispatch requires an existing tag: $tag" >&2
              exit 1
            fi
            sha="$(git rev-list -n 1 "$tag")"
          else
            read -r tag sha < .github/release-target
          fi
          test -n "$tag"
          test -n "$sha"
          version="${tag#v}"
          target_version="$(git show "${sha}:OPEN_GROK_VERSION" | tr -d '\r\n')"
          test "$version" = "$target_version"
          resolved_sha="$(git rev-parse "${sha}^{commit}")"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$resolved_sha"
          else
            echo "Tag $tag is not present; the publish job will create it with the release API." >&2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x86_64
    needs: resolve
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content OPEN_GROK_VERSION -TotalCount 1).Trim()
          if ("v$version" -ne '${{ needs.resolve.outputs.tag }}') {
            throw "Tag/version mismatch: tag=${{ needs.resolve.outputs.tag }} version=$version"
          }
          if ((git rev-parse HEAD).Trim() -ne '${{ needs.resolve.outputs.sha }}') {
            throw 'Checked-out commit does not match the resolved release target.'
          }

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Build and verify Windows release
        shell: pwsh
        run: .\scripts\build-windows-release.ps1

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/open-grok-windows-x86_64.exe
            dist/open-grok-windows-x86_64.exe.sha256
            dist/install.ps1

  linux:
    name: Linux ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            rg_triple: x86_64-unknown-linux-musl
            rg_sha256: 253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7
            protoc_asset: protoc-29.3-linux-x86_64.zip
            protoc_sha256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
          - arch: aarch64
            runner: ubuntu-22.04-arm
            rg_triple: aarch64-unknown-linux-gnu
            rg_sha256: 15f8cc2fab12d88491c54d49f38589922a9d6a7353c29b0a0856727bcdf80754
            protoc_asset: protoc-29.3-linux-aarch_64.zip
            protoc_sha256: 6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < OPEN_GROK_VERSION)"
          test "v${version}" = '${{ needs.resolve.outputs.tag }}'
          test "$(git rev-parse HEAD)" = '${{ needs.resolve.outputs.sha }}'

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ matrix.arch }}
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install pinned ripgrep
        shell: bash
        env:
          RG_TRIPLE: ${{ matrix.rg_triple }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep-15.0.0-${RG_TRIPLE}.tar.gz"
          curl -fL --retry 3 \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-${RG_TRIPLE}.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$RG_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RUNNER_TEMP/ripgrep-15.0.0-${RG_TRIPLE}/rg" \
            >> "$GITHUB_ENV"

      - name: Install pinned protoc
        shell: bash
        env:
          PROTOC_ASSET: ${{ matrix.protoc_asset }}
          PROTOC_SHA256: ${{ matrix.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$PROTOC_ASSET"
          protoc_root="$RUNNER_TEMP/protoc-29.3"
          curl -fL --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/$PROTOC_ASSET" \
            -o "$archive"
          printf '%s  %s\n' "$PROTOC_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$protoc_root"
          unzip -q "$archive" -d "$protoc_root"
          protoc="$protoc_root/bin/protoc"
          test "$("$protoc" --version)" = "libprotoc 29.3"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build and verify Linux release
        shell: bash
        run: ./scripts/build-linux-release.sh

      - name: Smoke Linux installer
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export OPENGROK_HOME="$smoke_root/home"
          export OPEN_GROK_BIN_DIR="$smoke_root/bin"
          export OPEN_GROK_RELEASE_BASE_URL="file://$PWD/dist"
          bash dist/install.sh '${{ needs.resolve.outputs.tag }}'
          "$smoke_root/bin/open-grok" --version | grep -F "$(cat OPEN_GROK_VERSION)"
          "$smoke_root/bin/open-grok" --version | grep -F "$(git rev-parse --short HEAD)"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-release
          if-no-files-found: error
          path: |
            dist/open-grok-linux-${{ matrix.arch }}
            dist/open-grok-linux-${{ matrix.arch }}.sha256

  macos:
    name: macOS Apple Silicon
    needs: resolve
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < OPEN_GROK_VERSION)"
          test "v${version}" = '${{ needs.resolve.outputs.tag }}'
          test "$(git rev-parse HEAD)" = '${{ needs.resolve.outputs.sha }}'

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz"
          curl -fL \
            https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b \
            "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RUNNER_TEMP/ripgrep-15.0.0-aarch64-apple-darwin/rg" \
            >> "$GITHUB_ENV"

      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc-29.3-osx-aarch_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-29.3"
          curl -fL \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip \
            -o "$archive"
          printf '%s  %s\n' \
            2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765 \
            "$archive" | shasum -a 256 -c -
          mkdir -p "$protoc_root"
          unzip -q "$archive" -d "$protoc_root"
          protoc="$protoc_root/bin/protoc"
          printf '%s  %s\n' \
            bdc43e54153911f625a50baf7d4f6bc05008712964141baedd5a61122f93a016 \
            "$protoc" | shasum -a 256 -c -
          test "$("$protoc" --version)" = "libprotoc 29.3"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build and verify macOS release
        shell: bash
        run: ./scripts/build-macos-release.sh

      - name: Smoke macOS installer
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export OPENGROK_HOME="$smoke_root/home"
          export OPEN_GROK_BIN_DIR="$smoke_root/bin"
          export OPEN_GROK_RELEASE_BASE_URL="file://$PWD/dist"
          bash dist/install.sh '${{ needs.resolve.outputs.tag }}'
          "$smoke_root/bin/open-grok" --version | grep -F "$(cat OPEN_GROK_VERSION)"
          "$smoke_root/bin/open-grok" --version | grep -F "$(git rev-parse --short HEAD)"

      - name: Upload macOS and common assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/open-grok-macos-aarch64
            dist/open-grok-macos-aarch64.sha256
            dist/install.sh
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES

  publish:
    name: Publish and verify GitHub release
    needs: [resolve, windows, linux, macos]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish exact assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"
          version="${version#v}"
          notes="docs/releases/v${version}.md"
          test -f "$notes"
          if gh release view '${{ needs.resolve.outputs.tag }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '${{ needs.resolve.outputs.tag }}' release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit '${{ needs.resolve.outputs.tag }}' \
              --repo "$GITHUB_REPOSITORY" \
              --title "Open Grok v${version}" \
              --notes-file "$notes" \
              --latest
          else
            gh release create '${{ needs.resolve.outputs.tag }}' release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target '${{ needs.resolve.outputs.sha }}' \
              --title "Open Grok v${version}" \
              --notes-file "$notes" \
              --latest
          fi

      - name: Re-download and compare public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-assets
          gh release download '${{ needs.resolve.outputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --dir public-assets
          for local_asset in release-assets/*; do
            name="$(basename "$local_asset")"
            cmp "$local_asset" "public-assets/$name"
          done
          latest_tag="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          )"
          test "$latest_tag" = '${{ needs.resolve.outputs.tag }}'
