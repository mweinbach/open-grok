[toolchain]
# We use the latest stable, but bump it manually.
# To avoid unnecessary churn and simplify regression detection
# - bump one point version at a time
# - wait at least a couple of weeks after the release before bumping
# After bumping the version, run
# ```
# cargo check --all-targets --workspace
# cargo clippy --all-targets --workspace
# ```
channel = "1.94.0"
components = ["rustfmt", "clippy"]
# minimal = rustc + std + cargo. rustfmt/clippy still come from `components`.
# `default` also pulls rust-docs, which CI release jobs never use.
# Do not list extra rustup targets here: GitHub release jobs are native, and
# extra targets force every CI rustup (including macOS/Windows) to download
# unused Linux stds. Host std is added automatically. Cross-compile with
# `rustup target add`.
profile = "minimal"
