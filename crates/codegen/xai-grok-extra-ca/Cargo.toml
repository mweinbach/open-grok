[package]
license = "Apache-2.0"
name = "xai-grok-extra-ca"
version = "0.1.0"
edition.workspace = true
description = "Opt-in extra TLS roots from OPENGROK_EXTRA_CA_BUNDLE (validated DER cache + reqwest 0.12 adapters)"

[dependencies]
reqwest = { workspace = true, features = ["rustls-tls-native-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-native-certs = "0.8"
tracing = { workspace = true }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
tempfile = { workspace = true }

[lints]
workspace = true
